    <style>
        :root { 
            --primary: #2c3e50; 
            --accent: #f1c40f; 
            --bingo-pink: #e91e63;
            --error: #ff4757; 
            --bg: #2f3542; 
            --card-bg: #ffffff;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: white;
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        .header-vibe {
            text-align: center;
            padding: 20px;
            background: linear-gradient(45deg, var(--bingo-pink), #8e44ad);
            width: 100%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .container { width: 95%; max-width: 900px; display: none; padding-bottom: 50px; }
        
        #login-overlay { 
            position: fixed; inset: 0; background: var(--bg); z-index: 1000; 
            display: flex; justify-content: center; align-items: center; 
        }

        .panel { 
            background: var(--card-bg); color: #333; padding: 25px; 
            border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); 
            margin-bottom: 20px; border: 4px solid var(--accent);
        }

        .grid { 
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; 
            margin: 20px 0; background: #ddd; padding: 10px; border-radius: 10px;
        }

        .cell { 
            background: white; aspect-ratio: 1/1; padding: 8px; border-radius: 5px; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            font-size: 0.85rem; font-weight: bold; cursor: pointer;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1); transition: all 0.2s;
            border: 2px solid #eee;
        }

        .cell:hover { transform: scale(1.02); background: #f9f9f9; }
        .cell.marked { 
            background: var(--bingo-pink) !important; color: white; 
            border-color: var(--accent); transform: rotate(-2deg);
        }
        
        .cell.wrong { background: var(--error); color: white; animation: shake 0.3s; }

        .btn { 
            background: var(--accent); color: var(--primary); border: none; 
            padding: 15px; font-weight: 800; border-radius: 8px; cursor: pointer; 
            width: 100%; text-transform: uppercase; letter-spacing: 1px;
        }

        .btn-danger { background: var(--error); color: white; margin-top: 10px; }

        #leaderboard { width: 100%; border-collapse: collapse; margin-top: 10px; }
        #leaderboard th { background: #eee; }
        #leaderboard td, #leaderboard th { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        
        .winner { background-color: #fff9c4 !important; animation: pulse 1s infinite; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>

<div id="login-overlay">
    <div class="panel" style="width: 320px; text-align: center;">
        <h1 style="margin-top:0;">🎫 BINGO!</h1>
        <p>Vul je gegevens in om mee te spelen</p>
        <input type="text" id="username" placeholder="Je Naam" style="width:90%; padding:12px; margin:10px 0; border: 2px solid #ddd; border-radius: 5px;">
        <select id="userclass" style="width:100%; padding:12px; margin:10px 0; border: 2px solid #ddd; border-radius: 5px;">
            <option value="alpha">Klas Alpha</option>
            <option value="bravo">Klas Bravo</option>
            <option value="charlie">Klas Charlie</option>
            <option value="delta">Klas Delta</option>
        </select>
        <button class="btn" onclick="startGame()">🎟️ DEELNAME STARTEN</button>
    </div>
</div>

<div class="header-vibe" id="header" style="display:none;">
    <h1 style="margin:0;">🎰 BINGO DASHBOARD 🎰</h1>
    <p id="class-display" style="font-weight:bold; color: var(--accent);"></p>
</div>

<div class="container" id="main-ui">

        <div class="panel">

            <p id="current-word-display" style="font-size: 1.5rem; text-align:center; color: var(--bingo-pink); min-height: 40px;"></p>
            <hr>
            <button class="btn btn-danger" onclick="resetSession()">🔄 RESET SPEL (VOOR IEDEREEN)</button>
        </div>
    </div>

    <div id="student-view" style="display:none;">
        <div class="panel">
            <h2 id="status-text" style="text-align:center; margin-top:0;">Wachten op de eerste bal... 🎱</h2>
            <div class="grid" id="bingo-grid"></div>
        </div>
    </div>

    <div class="panel">
        <h3 style="margin-top:0;">🏆 Live Tussenstand</h3>
        <table id="leaderboard">
            <thead><tr><th>Speler</th><th>Punten</th><th>Fouten</th><th>Status</th></tr></thead>
            <tbody id="leaderboard-body"></tbody>
        </table>
    </div>
</div>
